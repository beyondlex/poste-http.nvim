syntax = "proto3";

package poste.test.v1;

// Echo service for manual testing of Poste's GRPC requests.
// Server reflection is enabled, so grpcurl/Poste need no proto files.
service EchoService {
  // Unary: echoes the message back together with request metadata.
  rpc Echo(EchoRequest) returns (EchoResponse);

  // Server-streaming: yields `repeat` responses (default 3).
  rpc EchoStream(EchoRequest) returns (stream EchoResponse);

  // Always fails with the requested gRPC status code — for testing
  // status-code mapping (e.g. NOT_FOUND -> status 5).
  rpc Fail(FailRequest) returns (EchoResponse);
}

message EchoRequest {
  string message = 1;
  int32 repeat = 2;                 // EchoStream: number of responses
  map<string, string> metadata = 3; // (unused on input)
}

message EchoResponse {
  string message = 1;
  int32 seq = 2;                    // EchoStream: 0-based sequence number
  map<string, string> metadata = 3; // request metadata echoed back (lowercase keys)
}

message FailRequest {
  string code = 1;    // gRPC status name: NOT_FOUND, UNAVAILABLE, ...
  string message = 2; // details surfaced as the status message
}

// Order service for exercising Poste's gRPC completion: nested messages,
// enums, repeated fields, maps, and oneof all appear in body completions.
service OrderService {
  rpc PreviewOrder(OrderRequest) returns (OrderPreview);
}

enum OrderChannel {
  ORDER_CHANNEL_UNSPECIFIED = 0;
  ORDER_CHANNEL_WEB = 1;
  ORDER_CHANNEL_MOBILE = 2;
}

message Address {
  string street = 1;
  string city = 2;
  string country = 3;
}

message OrderItem {
  string sku = 1;
  int32 quantity = 2;
  double unit_price = 3;
}

message OrderRequest {
  string customer_id = 1;
  OrderChannel channel = 2;
  repeated OrderItem items = 3;
  Address shipping_address = 4;
  map<string, string> attributes = 5;
  oneof notification {
    string email = 6;
    string phone = 7;
  }
}

message OrderPreview {
  string preview_id = 1;
  double total = 2;
  string currency = 3;
}
